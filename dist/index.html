<!doctype html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root{--ink:#151715;--muted:#666b65;--line:#dfe2db;--paper:#f4f5f0;--white:#fff;--lime:#c8ff3d;--lime-dark:#98c41f;--orange:#ff7648;--blue:#4c82ff;--shadow:0 18px 60px rgba(21,23,21,.12)}
    *{box-sizing:border-box}html{font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--paper);color:var(--ink)}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr;background:var(--paper)}
    header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:rgba(244,245,240,.92);backdrop-filter:blur(18px);position:relative;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-size:1.08rem;font-weight:800;letter-spacing:-.04em}.logo{width:34px;height:34px;border-radius:11px;background:var(--ink);display:grid;place-items:center}.logo svg{width:22px;height:22px}.nav{display:flex;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:10px;font-weight:700}.nav button.active,.nav button:hover{background:var(--white);color:var(--ink)}.profile{display:flex;align-items:center;gap:10px}.weather{font-size:.86rem;color:var(--muted)}.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:800}
    main{display:grid;grid-template-columns:minmax(400px,42%) 1fr;min-height:calc(100vh - 72px)}.panel{padding:34px 32px 40px;overflow:auto;max-height:calc(100vh - 72px);border-right:1px solid var(--line)}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:8px 0 24px}.title-row h1{font-size:clamp(2rem,4vw,3.7rem);line-height:.98;letter-spacing:-.075em;margin:0;max-width:570px}.locate{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:11px 14px;font-weight:750;white-space:nowrap;box-shadow:0 2px 7px rgba(0,0,0,.03)}
    .search{height:54px;background:var(--white);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;padding:0 17px;gap:12px}.search svg{width:20px;color:var(--muted)}.search input{border:0;outline:0;width:100%;font-size:1rem;background:transparent}.filters{display:flex;gap:8px;overflow:auto;padding:14px 0 22px;scrollbar-width:none}.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;font-size:.88rem;font-weight:750;white-space:nowrap}.chip.active{background:var(--ink);border-color:var(--ink);color:var(--white)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}.section-head h2{font-size:1rem;margin:0}.section-head span{color:var(--muted);font-size:.84rem}
    .route-list{display:grid;gap:10px}.route-card{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:18px;padding:17px;transition:.2s ease;position:relative;text-align:left;color:inherit;width:100%}.route-card:hover,.route-card.active{background:var(--white);border-color:#b8bcb5;transform:translateY(-1px);box-shadow:0 10px 26px rgba(28,31,27,.07)}.route-card.active:before{content:"";position:absolute;left:-1px;top:18px;bottom:18px;width:4px;background:var(--lime-dark);border-radius:0 4px 4px 0}.card-top{display:flex;justify-content:space-between;gap:18px}.route-card h3{margin:0 0 7px;font-size:1.08rem;letter-spacing:-.02em}.route-card p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.5}.review{display:flex;gap:6px;align-items:flex-start;margin-top:10px;font-size:.78rem;line-height:1.45;color:#4f554e}.review b{color:#1d211d;white-space:nowrap}.difficulty{font-size:.72rem;font-weight:800;background:#e9ece6;padding:6px 9px;border-radius:999px;height:max-content}.stats{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid #e9ebe6}.stat b{display:block;font-size:.92rem}.stat span{font-size:.72rem;color:var(--muted)}
    .map-wrap{position:relative;overflow:hidden;background:#e9ece6}.map{position:absolute;inset:0;background-color:#eef0eb;background-image:linear-gradient(#dfe3dd 1px,transparent 1px),linear-gradient(90deg,#dfe3dd 1px,transparent 1px);background-size:52px 52px}.river{position:absolute;left:42%;top:-10%;width:190px;height:120%;background:#d8e5e5;transform:rotate(9deg);border-left:1px solid #c5d6d6;border-right:1px solid #c5d6d6}.park{position:absolute;width:210px;height:150px;background:#dfe9d7;border-radius:48% 52% 55% 45%;left:11%;top:18%;transform:rotate(-12deg)}.roads{position:absolute;inset:0;opacity:.8;background:linear-gradient(31deg,transparent 30%,#fff 30%,#fff 31%,transparent 31%),linear-gradient(-25deg,transparent 59%,#fff 59%,#fff 60%,transparent 60%)}.route-svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}.route-path{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 0;transition:.5s}.route-glow{fill:none;stroke:var(--lime);stroke-width:14;stroke-linecap:round;opacity:.86}.marker{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50% 50% 50% 8px;rotate:-45deg;background:var(--white);border:2px solid var(--ink);box-shadow:0 7px 18px rgba(0,0,0,.16);display:grid;place-items:center}.marker span{rotate:45deg;font-size:16px}.marker.start{left:22%;top:70%;background:var(--lime)}.marker.cafe{left:57%;top:34%}.marker.food{left:78%;top:66%}.map-label{position:absolute;background:rgba(255,255,255,.88);padding:5px 8px;border-radius:6px;font-size:.68rem;color:var(--muted);box-shadow:0 2px 5px rgba(0,0,0,.07)}.label-1{left:13%;top:13%}.label-2{left:48%;top:52%}.label-3{right:8%;top:19%}
    .map-tools{position:absolute;right:22px;top:22px;display:grid;gap:8px}.icon-btn{width:43px;height:43px;border:1px solid var(--line);border-radius:12px;background:var(--white);display:grid;place-items:center;box-shadow:0 5px 14px rgba(0,0,0,.08);font-weight:800}.detail{position:absolute;left:22px;right:22px;bottom:22px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:21px 22px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.detail h2{margin:0 0 6px;font-size:1.3rem;letter-spacing:-.035em}.detail p{margin:0;color:var(--muted);font-size:.85rem}.detail-stats{display:flex;gap:18px;margin-top:14px}.detail-stat b{font-size:1rem}.detail-stat span{font-size:.73rem;color:var(--muted);margin-left:4px}.start-btn{border:0;border-radius:14px;background:var(--ink);color:var(--white);padding:16px 20px;font-weight:800;display:flex;gap:10px;align-items:center}.start-btn span{color:var(--lime)}
    .ride-overlay{position:fixed;inset:0;background:var(--ink);z-index:100;display:none;color:var(--white)}.ride-overlay.show{display:block}.ride-map{position:absolute;inset:0;background:#222622}.ride-map .route-glow{stroke:var(--lime);opacity:.9}.ride-map .route-path{stroke:#efffd0;stroke-width:4}.ride-top{position:absolute;left:24px;right:24px;top:22px;display:flex;justify-content:space-between}.ride-pill{background:rgba(21,23,21,.78);border:1px solid #40453f;border-radius:999px;padding:10px 15px;font-size:.84rem;backdrop-filter:blur(12px)}.ride-pill b{color:var(--lime)}.ride-card{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;width:min(620px,calc(100% - 32px));background:var(--white);color:var(--ink);border-radius:24px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.instruction{display:grid;grid-template-columns:58px 1fr auto;gap:16px;align-items:center}.turn{width:58px;height:58px;border-radius:16px;background:var(--lime);display:grid;place-items:center;font-size:1.8rem}.instruction h2{margin:0;font-size:1.18rem}.instruction p{margin:5px 0 0;color:var(--muted);font-size:.84rem}.distance{font-size:1.3rem;font-weight:850}.ride-progress{height:5px;background:#e4e7e0;border-radius:5px;margin:18px 0}.ride-progress div{height:100%;width:22%;background:var(--ink);border-radius:5px}.ride-actions{display:flex;gap:9px}.ride-actions button{flex:1;border:1px solid var(--line);background:#f4f5f0;border-radius:12px;padding:12px;font-weight:750}.ride-actions .end{background:var(--ink);color:var(--white);border-color:var(--ink)}
    .toast{position:fixed;top:88px;left:50%;transform:translate(-50%,-20px);background:var(--ink);color:var(--white);padding:12px 18px;border-radius:12px;z-index:200;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);font-size:.9rem}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:850px){header{height:62px;padding:0 16px}.weather,.nav{display:none}main{display:block;min-height:calc(100vh - 62px)}.map-wrap{height:52vh;min-height:410px}.panel{max-height:none;border-right:0;padding:24px 18px 28px}.title-row h1{font-size:2.35rem}.locate{font-size:.82rem}.route-list{grid-template-columns:85% 85%;overflow:auto;margin-right:-18px;padding-right:18px;scroll-snap-type:x mandatory}.route-card{scroll-snap-align:start}.detail{left:12px;right:12px;bottom:12px;padding:16px;grid-template-columns:1fr}.detail-stats{gap:10px;flex-wrap:wrap}.start-btn{justify-content:center}.map-tools{right:12px;top:12px}.title-row{align-items:center}.title-row h1{max-width:260px}.panel{max-height:none}}
    @media(max-width:460px){.brand span:last-child{display:none}.title-row h1{font-size:2rem}.title-row{margin-bottom:18px}.detail h2{font-size:1.08rem}.detail p{display:none}.detail-stats{margin-top:10px}.detail-stat:nth-child(3){display:none}.map-wrap{height:55vh}.ride-card{bottom:14px}.instruction{grid-template-columns:50px 1fr}.distance{display:none}.turn{width:50px;height:50px}.marker.food{left:82%}}
    #gpsMap{position:absolute;inset:0;z-index:4}.map{display:none!important}.map-tools,.detail{z-index:8}.leaflet-popup-content{font-family:Inter,Pretendard,sans-serif;line-height:1.55}

<body>
  <div class="app">

          <svg class="route-svg" viewBox="0 0 800 700" preserveAspectRatio="none" aria-hidden="true"><path class="route-glow" d="M120 560 C180 490 170 380 270 350 S380 180 470 210 S560 330 650 300 S720 430 610 510 S400 590 290 520 S180 470 120 560"/><path class="route-path" d="M120 560 C180 490 170 380 270 350 S380 180 470 210 S560 330 650 300 S720 430 610 510 S400 590 290 520 S180 470 120 560"/></svg>

          <span class="map-label label-1">서울숲</span><span class="map-label label-2">한강 자전거길</span><span class="map-label label-3">뚝섬유원지</span>
        </div>

        <div class="detail">

  </div>
  <div class="ride-overlay" id="rideOverlay" aria-hidden="true">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
    const routes=[
      {id:1,name:'서울숲 · 한강 카페 루프',desc:'평탄한 한강길과 성수의 카페를 잇는 여유로운 코스',distance:28.4,time:'1시간 45분',elevation:'↑ 142m',difficulty:'쉬움',tags:['all','short','cafe','easy'],stops:'스팟 4곳'},

    ];
    const add=(id,name,distance,time,elevation,difficulty,tags,review,stops='스팟 5곳')=>routes.push({id,name,desc:review,distance,time,elevation,difficulty,tags,stops,review});
    add(4,'반포 · 잠수교 노을 루프',16.8,'1시간 5분','↑ 58m','쉬움',['all','short','easy'],'야간 조명이 예쁘고 첫 라이딩으로 부담 없다는 의견이에요.');
    add(5,'여의도 · 선유도 강바람',21.6,'1시간 25분','↑ 71m','쉬움',['all','short','easy','cafe'],'휴식 시설이 많고 풍경 전환이 좋다는 평이에요.');

    add(8,'중랑천 · 의정부 보급 라이드',47.5,'2시간 50분','↑ 184m','보통',['all','easy'],'천변 보급 포인트가 많아 긴 거리 도전에 좋다는 평이에요.');
    add(9,'탄천 · 분당 카페 왕복',38.1,'2시간 20분','↑ 156m','보통',['all','cafe','easy'],'신호가 적은 구간이 있어 페이스 유지가 편하다는 의견이에요.');
    add(10,'안양천 · 아라뱃길 입문',54.8,'3시간 20분','↑ 128m','보통',['all','easy'],'강바람을 맞으며 달리기 좋고 업힐 부담이 적다는 후기예요.');
    add(11,'아라뱃길 · 정서진 바람길',64.2,'3시간 50분','↑ 143m','보통',['all','easy'],'평지 장거리 훈련에 좋지만 바람은 꼭 확인하라는 조언이 많아요.');

    let selected=routes[0],activeFilter='all',zoom=1;
    const gpsMap=L.map('gpsMap',{zoomControl:false}).setView([37.548,127.041],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(gpsMap);let myPos=[37.548,127.041],me,routeLine,spots=L.layerGroup().addTo(gpsMap);
    function drawGpsRoute(){const d=(selected.id%8)*.008,c=[37.548+d,127.041+d],pts=[myPos,[(myPos[0]+c[0])/2+.012,(myPos[1]+c[1])/2-.01],c,[c[0]+.009,c[1]+.015]];if(routeLine)gpsMap.removeLayer(routeLine);routeLine=L.polyline(pts,{color:'#151715',weight:6}).addTo(gpsMap);spots.clearLayers();[['☕ 카페','휴식하기 좋다는 라이더 후기'],['🥪 보급','물·간식 보급이 편하다는 후기'],['🍜 식사','라이딩 후 들르기 좋은 식사 스팟']].forEach((s,i)=>L.marker(pts[Math.min(i+1,3)]).bindPopup(`<b>${s[0]} 추천</b><br>${s[1]}<br><small>${selected.review||selected.desc}</small>`).addTo(spots));gpsMap.fitBounds(routeLine.getBounds(),{padding:[45,45]})}
    function locate(){navigator.geolocation?.getCurrentPosition(p=>{myPos=[p.coords.latitude,p.coords.longitude];if(me)gpsMap.removeLayer(me);me=L.circleMarker(myPos,{radius:10,color:'#151715',weight:3,fillColor:'#c8ff3d',fillOpacity:1}).bindPopup('현재 위치').addTo(gpsMap);drawGpsRoute();showToast('현재 위치와 주변 코스를 표시했어요')},()=>showToast('위치 권한을 허용하면 내 주변 코스를 볼 수 있어요'),{enableHighAccuracy:true,timeout:10000})}drawGpsRoute();
    const list=document.getElementById('routeList'),toast=document.getElementById('toast');
    function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
    function render(){const q=document.getElementById('searchInput').value.trim().toLowerCase();const items=routes.filter(r=>r.tags.includes(activeFilter)&&(r.name+r.desc).toLowerCase().includes(q));document.getElementById('resultCount').textContent=`${items.length}개 코스`;list.innerHTML=items.map(r=>`<button class="route-card ${r.id===selected.id?'active':''}" data-id="${r.id}"><div class="card-top"><div><h3>${r.name}</h3><p>${r.desc}</p><div class="review"><b>후기 요약</b><span>${r.review||r.desc}</span></div></div><span class="difficulty">${r.difficulty}</span></div><div class="stats"><div class="stat"><b>${r.distance}km</b><span>거리</span></div><div class="stat"><b>${r.time}</b><span>예상 시간</span></div><div class="stat"><b>${r.elevation}</b><span>상승</span></div></div></button>`).join('')||'<div class="route-card"><h3>검색 결과가 없어요</h3><p>다른 지역이나 조건으로 다시 찾아보세요.</p></div>';document.querySelectorAll('.route-card[data-id]').forEach(el=>el.onclick=()=>selectRoute(Number(el.dataset.id)))}
    function selectRoute(id){selected=routes.find(r=>r.id===id);['Name','Desc','Distance','Time','Elevation','Stops'].forEach(k=>document.getElementById('detail'+k).textContent=selected[k.toLowerCase()]);document.getElementById('detailReview').textContent=selected.review||selected.desc;drawGpsRoute();render();showToast(`${selected.name} 코스와 후기 기반 보급 스팟을 지도에 표시했어요`)}
    document.querySelectorAll('.chip').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;render()});
    document.getElementById('searchInput').addEventListener('input',render);
    document.getElementById('locateBtn').onclick=locate;

    if(document.modelContext?.registerTool){
      const lifecycle=new AbortController();
      Promise.all([
        document.modelContext.registerTool({name:'find_riding_routes',title:'라이딩 코스 찾기',description:'거리, 카페, 난이도 조건에 맞는 현재 화면의 라이딩 코스를 찾습니다.',inputSchema:{type:'object',properties:{filter:{type:'string',enum:['all','short','cafe','easy','climb']}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:({filter='all'}={})=>routes.filter(r=>r.tags.includes(filter)).map(({id,name,distance,time,difficulty})=>({id,name,distance,time,difficulty}))},{signal:lifecycle.signal}),
        document.modelContext.registerTool({name:'select_riding_route',title:'라이딩 코스 선택',description:'코스 ID로 코스를 선택하고 지도와 상세 정보를 갱신합니다.',inputSchema:{type:'object',properties:{routeId:{type:'number'}},required:['routeId'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({routeId})=>{if(!routes.some(r=>r.id===routeId))throw new Error('존재하지 않는 코스입니다.');selectRoute(routeId);return{selectedRoute:selected.name,distance:selected.distance}}},{signal:lifecycle.signal}),
        document.modelContext.registerTool({name:'start_riding',title:'라이딩 시작',description:'현재 선택한 코스의 라이딩 모드를 시작합니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{document.getElementById('startRide').click();return{status:'started',route:selected.name}}},{signal:lifecycle.signal})
      ]).catch(()=>{});
